name: python-tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Smoke-test the CLI and API import
        run: |
          python -c "import sys; sys.path.insert(0, 'python'); from airoad.api import app; print(app.title)"
          python -c "import sys; sys.path.insert(0, 'python'); from airoad.__main__ import main; print('cli ok')"

  postgres:
    # The report store and rate limiter talk SQL, so run the same suite against a
    # real Postgres instead of only the SQLite fallback.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: airoad
          POSTGRES_DB: airoad_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the suite against Postgres
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:airoad@127.0.0.1:5432/airoad_test
        run: python -m pytest -q
