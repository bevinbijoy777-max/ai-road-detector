[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "airoad"
version = "0.1.0"
description = "On-device pothole and road-crack detection with an offline sync API"
readme = "README.md"
requires-python = ">=3.10"
# Keep in sync with requirements.txt.
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pillow>=10.4.0",
    "numpy>=1.26.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
airoad = "airoad.__main__:main"

[tool.setuptools]
package-dir = { "" = "python" }

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
